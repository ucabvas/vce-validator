{{- if .Values.cpuCheck.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-check
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-check
  template:
    metadata:
      labels:
        app: cpu-check
    spec:
      containers:
        - name: stress-test
          image: polinux/stress
          args: ["--cpu", "2", "--timeout", "30s"]
{{- end }}
